<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SunkGuard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Onest:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F5F3F0;--wash:#FFD3B8;--card:rgba(255,255,255,.74);--solid:#fff;--ink:#1D1B22;--mute:#6F6B78;--line:rgba(29,27,34,.09);--track:rgba(29,27,34,.08);--acc:#EE5F14;--ok:#17916F;--warn:#C97A00;--bad:#D23D35;--vio:#6552D9;--shadow:0 1px 2px rgba(30,20,40,.04),0 10px 32px rgba(30,20,40,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121116;--wash:#4A2412;--card:rgba(34,31,42,.8);--solid:#26232E;--ink:#F3F1F6;--mute:#A09BAA;--line:rgba(255,255,255,.09);--track:rgba(255,255,255,.09);--acc:#FF7A3D;--ok:#3CC9A0;--warn:#F0A72E;--bad:#FF6B62;--vio:#9C8CFF;--shadow:0 10px 32px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#121116;--wash:#4A2412;--card:rgba(34,31,42,.8);--solid:#26232E;--ink:#F3F1F6;--mute:#A09BAA;--line:rgba(255,255,255,.09);--track:rgba(255,255,255,.09);--acc:#FF7A3D;--ok:#3CC9A0;--warn:#F0A72E;--bad:#FF6B62;--vio:#9C8CFF;--shadow:0 10px 32px rgba(0,0,0,.35)}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(900px 420px at 88% -8%,var(--wash),transparent 70%),radial-gradient(700px 360px at -5% 0%,color-mix(in srgb,var(--vio) 12%,transparent),transparent 70%);background-repeat:no-repeat;color:var(--ink);font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.45}
h1,h3,.big,.disp{font-family:'Bricolage Grotesque','Onest',system-ui,sans-serif}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:16px 20px 56px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo{width:32px;height:32px;border-radius:10px;background:var(--acc);display:grid;place-items:center}
.nav{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;overflow-x:auto;max-width:100%;box-shadow:var(--shadow)}
.nav button{border:0;background:none;padding:8px 14px;border-radius:99px;cursor:pointer;display:flex;gap:7px;align-items:center;color:var(--mute);white-space:nowrap;font-weight:500}
.nav button.on{background:var(--ink);color:var(--bg)}
.nav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 4px}
.seg{display:inline-flex;background:var(--track);border-radius:99px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:99px;color:var(--mute);font-size:13px;cursor:pointer}
.seg button.on{background:var(--solid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lab{color:var(--mute);font-size:13px}
.btn{border:1px solid var(--line);background:var(--solid);border-radius:99px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--acc);color:#fff;border-color:transparent}
.btn.dark{background:var(--ink);color:var(--bg);border-color:transparent}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--mute)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
.live.off i{background:var(--warn);animation:none}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.vh{margin:22px 0 14px}
.vh h1{font-size:38px;line-height:1.05;letter-spacing:-.025em;margin:0 0 6px;font-weight:600}
.sub{color:var(--mute);font-size:13px}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
@media (max-width:980px){.g4,.g3{grid-template-columns:1fr 1fr}.g21,.g12{grid-template-columns:1fr}}
@media (max-width:600px){.g4,.g3,.g2{grid-template-columns:1fr}.vh h1{font-size:30px}}
.card{background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600}
.big{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:6px 0 2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--track);color:var(--mute)}
.pill.ok,.pill.s-done,.pill.good{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.s-running,.pill.hard{color:var(--vio);background:color-mix(in srgb,var(--vio) 15%,transparent)}
.pill.s-waiting,.pill.soft,.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.s-failed,.pill.s-starved,.pill.badp{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;display:flex;margin:10px 0 8px}
.bar.sm{height:6px;margin:0 0 3px;min-width:70px}
.bar i{display:block;height:100%}
.bar i.soft{background:repeating-linear-gradient(135deg,var(--vio) 0 3px,transparent 3px 6px)!important}
.nums{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:12.5px}.nums b{color:var(--ink);font-weight:600}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.agent p{margin:4px 0 10px}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;margin-bottom:12px}
.chain span{background:var(--track);border-radius:8px;padding:2px 8px}.chain i{color:var(--mute);font-style:normal}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.row3 b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:600;line-height:1.1}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.agent .row:last-child{justify-content:flex-start}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr[data-a]{cursor:pointer}.tbl tr[data-a]:hover td{background:var(--track)}
.scroll{overflow-x:auto}
.feed{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:9px}
.feed li{display:flex;gap:10px;font-size:13px}.feed time{color:var(--mute);min-width:36px;font-variant-numeric:tabular-nums}
.feed li:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:6px;flex:none}
.feed li.bad:before{background:var(--bad)}.feed li.warn:before,.feed li.ttl:before{background:var(--warn)}.feed li.rsv:before{background:var(--vio)}
.res{display:grid;gap:12px;margin-top:10px}
.res .bar{margin:5px 0 0}
.chart{width:100%;height:150px;display:block;margin-top:8px}.chart .grid{stroke:var(--line);stroke-width:1}
.cl{display:flex;gap:16px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}.cl i{display:inline-block;width:14px;height:3px;border-radius:3px;margin-right:6px;vertical-align:3px}
.split{display:grid;grid-template-columns:230px 1fr;gap:14px}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.rail{display:grid;gap:6px;align-content:start}
.rail button{text-align:left;border:1px solid var(--line);background:var(--solid);border-radius:12px;padding:9px 11px;cursor:pointer}
.rail button.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 22%,transparent)}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;margin:14px 0}
.node{width:150px;background:var(--solid);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:5px;align-content:start}
.node .ring{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--track);color:var(--mute)}
.node.done .ring{background:var(--ok);color:#fff}.node.running{border-color:var(--acc)}.node.running .ring{background:var(--acc);color:#fff;animation:pulse 1.4s infinite}
.node.waiting .ring{background:var(--warn);color:#fff}.node.failed{border-color:var(--bad)}.node.failed .ring{background:var(--bad);color:#fff}
.link{width:22px;align-self:center;height:2px;background:var(--line);flex:none}
@media (max-width:600px){.link{display:none}.flow{gap:8px}.node{width:calc(50% - 4px)}}
.chip{font-size:11.5px;border-radius:8px;padding:2px 7px;background:var(--track);width:fit-content}
.chip.hard{color:var(--vio);background:color-mix(in srgb,var(--vio) 15%,transparent)}.chip.soft{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.chip.warn{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.rng{display:grid;grid-template-columns:1fr;gap:4px;margin-bottom:12px}.rng label{display:flex;justify-content:space-between;font-size:13px}
input[type=range]{width:100%;accent-color:var(--acc)}
.note{border-left:3px solid var(--acc);padding:8px 12px;background:color-mix(in srgb,var(--acc) 8%,transparent);border-radius:0 10px 10px 0;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span>SunkGuard</div>
    <nav class="nav" id="nav"></nav>
    <span class="sp"></span>
    <button class="btn" data-a="theme" id="themeBtn">Theme</button>
  </div>
  <div class="ctl" id="ctl"></div>
  <main id="view"></main>
</div>

<script>
//#ENGINE-START
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const RES=[
 {id:'pro',name:'Gemini Pro',short:'Pro',kind:'Model',cap:7},
 {id:'flash',name:'Gemini Flash',short:'Flash',kind:'Model',cap:14},
 {id:'search',name:'Web Search',short:'Search',kind:'Tool',cap:4},
 {id:'code',name:'Code Runner',short:'Code',kind:'Tool',cap:3},
 {id:'vdb',name:'Vector DB',short:'Vector DB',kind:'Service',cap:5},
 {id:'crm',name:'CRM API',short:'CRM',kind:'Service',cap:3}];
const RM=Object.fromEntries(RES.map(r=>[r.id,r]));
const TPL=[
 {id:'research',name:'Market research brief',short:'Research',desc:'Searches the web, drafts a brief, then reviews it.',steps:[['search',2,3],['pro',4,4],['flash',2,3],['pro',3,4]]},
 {id:'codefix',name:'Code fix agent',short:'Code fix',desc:'Pulls context, proposes a fix, and runs the tests.',steps:[['vdb',2,2],['pro',3,4],['code',2,3],['code',2,3],['flash',2,2]]},
 {id:'support',name:'Support resolution',short:'Support',desc:'Answers a ticket and updates the customer record.',steps:[['vdb',1,2],['flash',2,3],['crm',2,2],['flash',1,2]]},
 {id:'lead',name:'Lead qualification',short:'Lead',desc:'Scores inbound leads and routes them to sales.',steps:[['crm',2,2],['flash',2,3],['pro',2,3],['crm',1,2]]},
 {id:'digest',name:'Data digest',short:'Digest',desc:'Builds a daily digest from live company data.',steps:[['search',2,3],['vdb',2,2],['pro',5,5],['flash',2,3]]}];
const tokOf=(r,u)=>r==='pro'?u*1600:r==='flash'?u*700:0;
const POLICY={light:{h:1,thr:.55,wgt:.6},medium:{h:2,thr:.3,wgt:1.2},aggressive:{h:9,thr:.1,wgt:2.4}};
const PAT=8,QPAT=28,TTL=14,HARDCAP=.8,AGING=.35,SEED=7,LOAD=.5;
const G={paused:{},policy:'medium',view:'orch',filter:'all',sel:null,speed:1,play:true,price:3};
function spawnAt(t){const r=mulberry(SEED*9973+t*7919);if(r()>LOAD)return null;const tpl=Math.floor(r()*TPL.length),len=TPL[tpl].steps.length;const o={tpl,base:1+Math.floor(r()*3),dv:r()<.16?1+Math.floor(r()*(len-1)):-1,noise:(r()-.5)*.16};return G.paused[TPL[tpl].id]?null:o}
function newEngine(on){return{on,t:0,nid:0,rng:mulberry(SEED+(on?1:2)),wfs:[],hist:[],log:[],rsv:[],used:Object.fromEntries(RES.map(r=>[r.id,0])),tokens:0,wasted:0,done:0,failed:0,late:0,starved:0,durs:[],qw:[],utilS:0,heldS:0,ticks:0,tokByRes:{pro:0,flash:0},tokByTpl:{},tp:{},series:{tok:[],wasted:[],p95:[]},tickTok:0}}
function log(e,msg,kind){e.log.unshift({t:e.t,msg,kind});if(e.log.length>40)e.log.pop()}
function mkWf(e,s){const tp=TPL[s.tpl];const raw=s.steps||tp.steps;const steps=raw.map(([r,u,d])=>({r,u,d,tok:tokOf(r,u),w:tokOf(r,u)||u*300}));const pred=steps.map(x=>({...x}));let dv=-1;
 if(s.dv>=1&&s.dv<steps.length){dv=s.dv;const c=steps[dv].r;pred[dv].r=c==='pro'?'flash':c==='flash'?'pro':c==='search'?'vdb':'search'}
 return{id:++e.nid,tid:tp.id,tpl:tp.name,name:s.name||tp.short+' #'+e.nid,steps,pred,dv,mism:false,idx:0,state:'queued',wait:0,age:0,base:s.base,spent:0,work:0,total:steps.reduce((a,b)=>a+b.w,0),run:null,conf:.5,noise:s.noise,born:e.t,started:-1,demo:s.demo||''}}
function finish(e,w,st){w.state=st;w.end=e.t;e.rsv=e.rsv.filter(x=>x.w!==w.id);const b=(e.tp[w.tid]??={done:0,fail:0});
 if(st==='done'){e.done++;b.done++;e.durs.push(e.t-w.born);if(e.durs.length>300)e.durs.shift()}
 else{if(st==='failed'){e.failed++;e.wasted+=w.spent;if(w.work/w.total>=.5)e.late++}else e.starved++;b.fail++;log(e,w.name+(st==='failed'?' failed at step '+(w.idx+1)+' of '+w.steps.length+', losing '+w.spent.toLocaleString()+' tokens of work':' timed out in the queue'),'bad')}
 e.hist.unshift(w);if(e.hist.length>40)e.hist.pop()}
function mismatch(e,w){w.mism=true;w.mismT=e.t;const st=w.steps[w.dv],was=w.pred[w.dv];e.rsv=e.rsv.filter(x=>x.w!==w.id);w.pred[w.dv]={...st};log(e,w.name+' diverged: expected '+RM[was.r].name+', got '+RM[st.r].name+'. Released the stale reservation and re-predicted.','warn')}
function plan(e){const P=POLICY[G.policy],by=new Map(e.wfs.map(w=>[w.id,w]));const keep=[];
 for(const r of e.rsv){r.ttl--;const w=by.get(r.w);if(!w)continue;if(r.ttl<=0){log(e,'TTL expired: released '+r.u+' units of '+RM[r.r].name+' held for '+w.name,'ttl');w.noRsv=e.t+6;continue}keep.push(r)}e.rsv=keep;
 const from=w=>w.idx+(w.run?1:0),remOf=w=>w.pred.slice(from(w),from(w)+P.h);
 const cand=e.wfs.filter(w=>w.work/w.total>=P.thr&&e.t>=(w.noRsv||0)&&remOf(w).length);
 const val=w=>w.work/(remOf(w).reduce((a,b)=>a+b.u,0)||1);cand.sort((a,b)=>val(b)-val(a));const wanted=new Set();
 for(const w of cand){w.conf=Math.max(.3,Math.min(.97,.58+.13*w.idx+w.noise-(w.mism&&e.t-w.mismT<6?.25:0)));const per={};for(const s of remOf(w))per[s.r]=Math.max(per[s.r]||0,s.u);
  for(const[r,u]of Object.entries(per)){const k=w.id+':'+r;let kind=w.conf>=.8?'hard':w.conf>=.5?'soft':null;if(!kind)continue;
   if(kind==='hard'){const held=e.rsv.filter(x=>x.r===r&&x.kind==='hard'&&x.k!==k).reduce((a,b)=>a+b.u,0);if(held+u>Math.floor(RM[r].cap*HARDCAP))kind='soft'}
   wanted.add(k);const have=e.rsv.find(x=>x.k===k);
   if(have){have.u=u;have.kind=kind;have.conf=w.conf}else{e.rsv.push({k,w:w.id,r,u,kind,ttl:TTL,conf:w.conf});
    if(!w.logged){w.logged=1;log(e,'Protecting '+w.name+': reserved '+(P.h>=9?'the remaining chain':'the next '+P.h+' step'+(P.h>1?'s':''))+' ('+kind+', '+Math.round(w.conf*100)+'% confidence)','rsv')}}}}
 e.rsv=e.rsv.filter(x=>wanted.has(x.k))}
function request(e){const P=POLICY[G.policy];const c=e.wfs.filter(w=>!w.run&&w.idx<w.steps.length&&!['done','failed','starved'].includes(w.state));
 if(e.on){c.forEach(w=>w.score=w.base+w.wait*AGING+P.wgt*(w.work/1000));c.sort((a,b)=>b.score-a.score)}
 else for(let i=c.length-1;i>0;i--){const j=Math.floor(e.rng()*(i+1));[c[i],c[j]]=[c[j],c[i]]}
 for(const w of c){const st=w.steps[w.idx],R=RM[st.r];const oth=e.on?e.rsv.filter(x=>x.r===st.r&&x.kind==='hard'&&x.w!==w.id).reduce((a,b)=>a+b.u,0):0;
  if(R.cap-e.used[st.r]-oth>=st.u){e.used[st.r]+=st.u;w.run={left:st.d};w.state='running';if(w.started<0){w.started=e.t;e.qw.push(e.t-w.born);if(e.qw.length>300)e.qw.shift()}if(e.on)e.rsv=e.rsv.filter(x=>!(x.w===w.id&&x.r===st.r))}
  else{w.wait++;w.state=w.idx===0&&w.started<0?'queued':'waiting';if(w.idx>0&&w.wait>PAT)finish(e,w,'failed');else if(w.idx===0&&w.wait>QPAT)finish(e,w,'starved')}}}
const p95=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(.95*(s.length-1))]};
function tick(e){e.t++;e.ticks++;e.tickTok=0;const s=spawnAt(e.t);if(s)e.wfs.push(mkWf(e,s));
 for(const w of e.wfs){w.age++;if(w.run&&--w.run.left<=0){const st=w.steps[w.idx];e.used[st.r]-=st.u;w.spent+=st.tok;w.work+=st.w;e.tokens+=st.tok;e.tickTok+=st.tok;if(st.r in e.tokByRes)e.tokByRes[st.r]+=st.tok;e.tokByTpl[w.tid]=(e.tokByTpl[w.tid]||0)+st.tok;w.idx++;w.run=null;w.wait=0;w.state='waiting';
   if(w.idx>=w.steps.length)finish(e,w,'done');else if(e.on&&w.dv===w.idx&&!w.mism)mismatch(e,w)}}
 if(e.on)plan(e);request(e);
 const cap=RES.reduce((a,r)=>a+r.cap,0),used=Object.values(e.used).reduce((a,b)=>a+b,0);e.utilS+=used/cap;e.heldS+=e.rsv.filter(x=>x.kind==='hard').reduce((a,b)=>a+b.u,0)/cap;
 const S=e.series;S.tok.push(e.tickTok);S.wasted.push(e.wasted);S.p95.push(p95(e.durs));for(const k in S)if(S[k].length>90)S[k].shift();

function M(e){const fin=e.done+e.failed+e.starved,q=e.qw.slice(-200),x=q.map(v=>1/(1+v));

function drawChrome(){$('#nav').innerHTML=Object.entries(VIEWS).map(([k,v])=>`<button class="${G.view===k?'on':''}" data-a="go" data-v="${k}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${v.n}</button>`).join('');
 const seg=(a,cur,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${cur==v?'on':''}" data-a="${a}" data-v="${v}">${l}</button>`).join('')}</div>`;
 $('#ctl').innerHTML=`<span class="live ${G.play?'':'off'}"><i></i>Simulated data</span><button class="btn" data-a="play">${G.play?'Pause':'Resume'}</button><span class="lab">Speed</span>${seg('speed',G.speed,[[1,'1×'],[2,'2×'],[4,'4×']])}<span class="lab">Protection</span>${seg('policy',G.policy,[['light','Light'],['medium','Medium'],['aggressive','Aggressive']])}<span class="sp"></span><button class="btn pri" data-a="inject">Inject the 87% vs new-run scene</button><button class="btn" data-a="reset">Reset</button>`}
let timer;function start(){clearInterval(timer);if(G.play)timer=setInterval(()=>{step();render()},1000/G.speed)}
function warm(k){for(let i=0;i<k;i++)step()}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
 if(a==='go'){G.view=v}else if(a==='sel'){G.sel=+v;G.view='wf'}else if(a==='flow'){const w=E.on.wfs.find(x=>x.tid===v);if(w)G.sel=w.id;G.view='wf'}
 else if(a==='filter')G.filter=v;else if(a==='pause')G.paused[v]=!G.paused[v];else if(a==='policy')G.policy=v;else if(a==='speed'){G.speed=+v;start()}
 else if(a==='play'){G.play=!G.play;start()}else if(a==='inject')inject();else if(a==='reset'){E={on:newEngine(true),off:newEngine(false)};G.sel=null;warm(60)}
 else if(a==='theme'){const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark'}
 drawChrome();render()});
document.addEventListener('input',ev=>{if(ev.target.closest('#whatif'))updWhatIf()});
warm(70);drawChrome();render();start();
</script>
</body>
</html>
